<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chalk talk</title>
    <meta name="description" content="Upload a badminton match and get it broken down on a coach's tactics board." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22%3E%3Ccircle cx=%2210%22 cy=%2214%22 r=%227.5%22 fill=%22%231F57C3%22/%3E%3Ccircle cx=%2219%22 cy=%2214%22 r=%227.5%22 fill=%22%23D3362D%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <header class="rail" id="rail">
      <a class="wordmark" href="#/" aria-label="Chalk talk, home">
        <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
          <circle cx="10" cy="14" r="7.5" fill="var(--blue)" />
          <circle cx="19" cy="14" r="7.5" fill="var(--red)" />
          <circle cx="10" cy="14" r="7.5" fill="none" stroke="var(--board)" stroke-width="1.5" />
        </svg>
        <span>Chalk talk</span>
      </a>
      <nav class="rail-nav" id="rail-nav" aria-label="Match"></nav>
      <a class="rail-cta" id="rail-cta" href="#/upload">Analyse a match</a>
    </header>
    <main id="view" tabindex="-1"></main>
    <div class="tip" id="tip" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
