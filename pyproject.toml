[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-match-analyzer"
version = "0.1.0"
description = "Local badminton video inspection, tracking, and annotation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "av>=14,<17",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "psutil>=5.8,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.17,<1"]
tracking = ["ultralytics>=8.3,<9", "lap>=0.5,<1"]
download = ["gdown>=5,<6"]

[project.scripts]
badminton = "badminton.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
badminton = ["static/*", "vendor/*.json", "vendor/*LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["backend/badminton/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4", "RUF", "LOG"]

