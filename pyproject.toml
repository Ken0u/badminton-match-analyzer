[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-match-analyzer"
version = "0.9.0"
description = "Local badminton video inspection, tracking, and annotation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "av>=14.2,<17",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "psutil>=5.8,<8",
  "python-multipart>=0.0.22,<1",
  "scenedetect==0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.17,<1"]
tracking = ["ultralytics>=8.3,<9", "lap>=0.5,<1"]
download = ["gdown>=5,<6"]
youtube = ["yt-dlp[default]>=2026.8.19"]
recognition = ["positional-encodings>=6,<7", "torchinfo>=1.8,<2"]

[project.scripts]
badminton = "badminton.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
badminton = ["static/*", "assets/*", "model_manifest.json", "shuttleset_manifest.json", "side_training_manifest.json", "vendor/*.json", "vendor/*LICENSE", "vendor/bst/*.json", "vendor/bst/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["backend/badminton/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4", "RUF", "LOG"]

