[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-match-analyzer"
version = "0.24.0"
description = "Local badminton video inspection, tracking, and annotation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "av>=14.2,<17",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "psutil>=5.8,<8",
  "python-multipart>=0.0.22,<1",
  "scenedetect==0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.17,<1"]
tracking = ["ultralytics>=8.3,<9", "lap>=0.5,<1"]
download = ["gdown>=5,<6"]
youtube = ["yt-dlp[default]>=2026.8.19"]
recognition = ["positional-encodings>=6,<7", "torchinfo>=1.8,<2"]
learning = ["torch>=2.6,<3", "torchvision>=0.21,<1"]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]
cuda = ["torch==2.8.0", "torchvision==0.23.0"]

[project.scripts]
badminton = "badminton.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["badminton", "badminton.*"]

[tool.setuptools.package-data]
badminton = ["static/*", "static/assets/*", "assets/*", "model_manifest.json", "shuttleset_manifest.json", "s2doubles_manifest.json", "finebadminton_manifest.json", "aicup2023_manifest.json", "aicup_capture_groups_v1.json", "visual_learning_manifest.json", "side_training_manifest.json", "vendor/*.json", "vendor/*LICENSE", "vendor/bst/*.json", "vendor/bst/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["backend/badminton/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4", "RUF", "LOG"]


# Explicit accelerator profiles prevent PyPI's Linux CUDA defaults entering CPU installs.
[tool.uv]
required-version = "==0.9.4"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
