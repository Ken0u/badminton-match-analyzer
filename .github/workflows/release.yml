name: Private candidates
run-name: Private candidate ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Verified merged-main commit
        required: true
        type: string
concurrency:
  group: private-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.validate.outputs.source }}
      publisher: ${{ steps.validate.outputs.publisher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/release_candidate.py validate
  package:
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.publisher }}
          path: publisher
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.4'
      - run: uv sync --locked --python 3.12 --extra dev --extra youtube
        working-directory: source
      - run: uv run --no-sync python scripts/verify_package.py --build --dist-dir dist
        working-directory: source
      - name: Candidate inventory
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.eligibility.outputs.source }}
          PUBLISHER_SHA: ${{ needs.eligibility.outputs.publisher }}
        run: source/.venv/bin/python publisher/scripts/release_candidate.py inventory --source-root source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ needs.eligibility.outputs.source }}
          path: |
            source/dist/*.whl
            source/dist/*.tar.gz
            source/dist/candidate.json
          if-no-files-found: error
          retention-days: 30
  images:
    needs: [eligibility, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [review, cpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.publisher }}
          path: publisher
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require declared package visibility before push
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.eligibility.outputs.source }}
          PUBLISHER_SHA: ${{ needs.eligibility.outputs.publisher }}
        run: python publisher/scripts/release_candidate.py package-visibility --target "${{ matrix.target }}"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ken0u/badminton-match-analyzer-${{ matrix.target }}:sha-${{ needs.eligibility.outputs.source }}
          provenance: false
          sbom: false
      - name: Persist immutable image receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.eligibility.outputs.source }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TARGET: ${{ matrix.target }}
          PUBLISHER_SHA: ${{ needs.eligibility.outputs.publisher }}
        run: python publisher/scripts/release_candidate.py image-receipt --source-root source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}-${{ needs.eligibility.outputs.source }}
          path: source/dist/image-*.json
          retention-days: 30
