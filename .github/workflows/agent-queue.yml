name: Agent coordination
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited, reopened, closed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [Checks, Private candidates]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: agent-coordination
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reconcile:
    # Heartbeat comment edits intentionally do not wake the controller.
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '<!-- agent-request:v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Reconcile and integrate with trusted main code only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/agent_queue.py integrate
      - name: Launch bounded completion observers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/observe_completion.py launch
      - name: Update configured private Project
        if: success() && vars.AGENT_PROJECT_NUMBER != ''
        env:
          AGENT_PROJECT_TOKEN: ${{ secrets.AGENT_PROJECT_TOKEN }}
          BADMINTON_PROJECT_NUMBER: ${{ vars.AGENT_PROJECT_NUMBER }}
        run: python scripts/project_status.py
