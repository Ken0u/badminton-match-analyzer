name: Feature proposal
description: Suggest a new feature or improvement
title: ""
body:
  - type: markdown
    attributes:
      value: "Describe what you would like the analyzer to do. Never paste credentials, private videos or model weights."
  - type: textarea
    id: problem
    attributes:
      label: Desired outcome
      description: Explain the problem and who benefits.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Examples and success criteria
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints, priority and related work
      description: Include relevant issue/PR/report links and any deadline.
